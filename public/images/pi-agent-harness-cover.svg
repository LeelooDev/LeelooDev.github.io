<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 780" width="2400" height="780" role="img" aria-label="手绘蜡笔风插画：中间的终端窗口里是一个 π 字符，左侧是四层堆叠的包，上方的云代表模型供应商，右侧是一棵分叉的会话树，下方排着 read、bash、edit 三个工具卡片">
<defs>
  <filter id="crayon" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="crayon-soft" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <rect width="9" height="9" fill="#cfe0f0"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#9dc0e0" stroke-width="3.4"/>
  </pattern>
  <pattern id="hatch-navy" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <rect width="9" height="9" fill="#2f4c78"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#3d5f8f" stroke-width="3.4"/>
  </pattern>
  <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
    <rect width="9" height="9" fill="#f2c69a"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#e79a55" stroke-width="3.4"/>
  </pattern>
  <pattern id="hatch-yellow" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
    <rect width="9" height="9" fill="#f7dfa2"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#eec25a" stroke-width="3.4"/>
  </pattern>
  <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <rect width="9" height="9" fill="#cfdcbe"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#9cb884" stroke-width="3.4"/>
  </pattern>
  <pattern id="hatch-paper" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <rect width="9" height="9" fill="#eef3f9"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#dde6f1" stroke-width="3.4"/>
  </pattern>
</defs>

<rect width="2400" height="780" fill="#f8f0e2"/>
<rect width="2400" height="780" filter="url(#grain)" opacity="0.16"/>

<!-- 地面上的蜡笔涂抹 -->
<g filter="url(#crayon)" opacity="0.5" stroke-linecap="round" fill="none">
  <path d="M420 636 q150 -22 316 -6" stroke="#eec25a" stroke-width="16"/>
  <path d="M446 660 q160 -18 300 -2" stroke="#eec25a" stroke-width="11"/>
  <path d="M866 706 q330 -30 700 -4" stroke="#9dc0e0" stroke-width="18"/>
  <path d="M902 730 q320 -26 640 -2" stroke="#9dc0e0" stroke-width="12"/>
  <path d="M1618 546 q210 -22 396 -4" stroke="#b7cfa4" stroke-width="16"/>
  <path d="M1650 568 q200 -18 340 -2" stroke="#b7cfa4" stroke-width="10"/>
</g>

<!-- 左侧：四层包堆叠 -->
<g filter="url(#crayon)" stroke="#2c4a7c" stroke-linejoin="round" stroke-linecap="round">
  <g stroke-width="6">
    <rect x="400" y="470" width="344" height="58" rx="14" fill="url(#hatch-green)"/>
    <rect x="418" y="402" width="344" height="58" rx="14" fill="url(#hatch-yellow)"/>
    <rect x="436" y="334" width="344" height="58" rx="14" fill="url(#hatch-orange)"/>
    <rect x="454" y="266" width="344" height="58" rx="14" fill="url(#hatch-blue)"/>
  </g>
  <g stroke-width="9" opacity="0.75">
    <path d="M430 500 h56"/><path d="M508 500 h96"/>
    <path d="M448 432 h56"/><path d="M526 432 h124"/>
    <path d="M466 364 h56"/><path d="M544 364 h84"/>
    <path d="M484 296 h56"/><path d="M562 296 h140"/>
  </g>
</g>

<!-- 包 → 终端 的虚线 -->
<g filter="url(#crayon-soft)" fill="none" stroke="#7f92aa" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 26">
  <path d="M804 296 q54 6 76 42"/>
  <path d="M792 492 q64 12 88 -46"/>
</g>

<!-- 上方：模型供应商的云 -->
<g filter="url(#crayon)" stroke="#3b82c4" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
  <path d="M1108 156 q-8 -58 52 -66 q18 -56 82 -50 q34 -50 92 -20 q66 -14 78 50 q54 12 44 62 q-8 26 -46 26 h-256 q-42 2 -46 -2 z" fill="url(#hatch-paper)"/>
  <g stroke-width="7" opacity="0.5">
    <path d="M1146 152 h72"/>
    <path d="M1252 152 h118"/>
    <path d="M1184 128 h44"/>
  </g>
</g>
<g filter="url(#crayon-soft)" fill="none" stroke="#7f92aa" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 24">
  <path d="M1240 186 v22"/>
  <path d="M1188 184 q-16 12 -18 26"/>
  <path d="M1294 184 q16 12 18 26"/>
</g>

<!-- 中间：终端窗口 -->
<g filter="url(#crayon)">
  <rect x="880" y="212" width="640" height="404" rx="24" fill="url(#hatch-navy)" stroke="#22406e" stroke-width="8"/>
  <g>
    <circle cx="922" cy="248" r="12" fill="#e0574a"/>
    <circle cx="962" cy="248" r="12" fill="#f0b429"/>
    <circle cx="1002" cy="248" r="12" fill="#7fa86a"/>
  </g>
  <rect x="906" y="278" width="588" height="316" rx="14" fill="#eef4fa" stroke="#22406e" stroke-width="6"/>
</g>

<!-- 终端里的 π -->
<g filter="url(#crayon)" fill="none" stroke="#3b82c4" stroke-linecap="round">
  <path d="M1000 356 q76 -10 154 -2" stroke-width="22"/>
  <path d="M1034 366 q-6 60 -14 122" stroke-width="20"/>
  <path d="M1120 366 q6 62 20 122" stroke-width="20"/>
  <path d="M1010 496 q28 8 50 -2" stroke-width="14" opacity="0.8"/>
  <path d="M1124 494 q28 10 52 -4" stroke-width="14" opacity="0.8"/>
</g>

<!-- 终端里的输出行 -->
<g filter="url(#crayon-soft)" stroke-linecap="round" fill="none">
  <path d="M1232 336 h206" stroke="#e8863f" stroke-width="15"/>
  <path d="M1232 384 h148" stroke="#7f92aa" stroke-width="15"/>
  <path d="M1232 432 h226" stroke="#7fa86a" stroke-width="15"/>
  <path d="M1232 480 h124" stroke="#7f92aa" stroke-width="15"/>
  <path d="M1232 528 h182" stroke="#3b82c4" stroke-width="15"/>
</g>
<g filter="url(#crayon)">
  <rect x="1234" y="556" width="26" height="26" rx="5" fill="#e0574a"/>
</g>

<!-- 终端 → 会话树 -->
<g filter="url(#crayon-soft)" fill="none" stroke="#7f92aa" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 24">
  <path d="M1536 396 q40 -6 62 -34"/>
</g>

<!-- 右侧：追加式会话树 -->
<g filter="url(#crayon)" fill="none" stroke="#2c4a7c" stroke-width="7" stroke-linecap="round">
  <path d="M1652 314 q54 -8 106 0"/>
  <path d="M1786 314 q54 -8 106 0"/>
  <path d="M1920 314 q40 -6 64 -34" opacity="0.45" stroke-dasharray="10 16"/>
  <path d="M1772 344 q22 62 84 82"/>
  <path d="M1918 438 q52 -6 102 6"/>
</g>
<g filter="url(#crayon)" stroke="#2c4a7c" stroke-width="7">
  <circle cx="1622" cy="314" r="30" fill="url(#hatch-blue)"/>
  <circle cx="1770" cy="314" r="30" fill="url(#hatch-blue)"/>
  <circle cx="1918" cy="314" r="30" fill="url(#hatch-paper)" opacity="0.85"/>
  <circle cx="1888" cy="438" r="30" fill="url(#hatch-orange)"/>
  <circle cx="2042" cy="446" r="34" fill="url(#hatch-orange)"/>
</g>
<g filter="url(#crayon)" fill="none" stroke="#e0574a" stroke-width="8" stroke-linecap="round">
  <path d="M2042 380 v28"/>
  <path d="M2016 396 l26 -22 l26 22"/>
</g>

<!-- 下方：三个工具卡片 -->
<g filter="url(#crayon)" stroke="#2c4a7c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
  <rect x="938" y="644" width="156" height="98" rx="14" fill="url(#hatch-yellow)"/>
  <rect x="1122" y="644" width="156" height="98" rx="14" fill="url(#hatch-orange)"/>
  <rect x="1306" y="644" width="156" height="98" rx="14" fill="url(#hatch-green)"/>
  <g stroke-width="8" opacity="0.8" fill="none">
    <path d="M968 676 h64"/><path d="M968 700 h96"/><path d="M968 722 h48"/>
    <path d="M1152 678 l22 20 l-22 20"/><path d="M1188 720 h58"/>
    <path d="M1336 700 l24 24 l58 -60"/><path d="M1336 674 h72"/>
  </g>
</g>
<g filter="url(#crayon-soft)" fill="none" stroke="#7f92aa" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 22">
  <path d="M1016 624 v14"/>
  <path d="M1200 624 v14"/>
  <path d="M1384 624 v14"/>
</g>
</svg>
